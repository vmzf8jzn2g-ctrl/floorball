<title>Innebandyresultat 2026</title>

<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#697386;--line:#e5e9f0;--accent:#1769e0;--accent2:#0b4fb3;--win:#15803d;--loss:#dc2626;--draw:#b7791f;--shadow:0 8px 28px rgba(23,32,51,.07)}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#0c1d3d,#1769e0);color:white;padding:44px 20px 34px}
.wrap{max-width:1120px;margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:800;opacity:.75}
h1{font-size:clamp(30px,5vw,48px);margin:8px 0 8px}.lead{margin:0;opacity:.86;font-size:16px}
.controls{margin-top:24px;display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
input,select{width:100%;border:0;border-radius:12px;padding:14px 16px;font-size:15px;background:white;color:var(--text);box-shadow:0 5px 18px rgba(0,0,0,.1)}
main{padding:28px 20px 60px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.pill{border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:999px;font-size:13px;color:var(--muted)}
h2{font-size:24px;margin:34px 0 14px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow)}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}
.competition{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden;box-shadow:var(--shadow)}
.comp-title{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.comp-title h3{margin:0;font-size:18px}.comp-title small{color:var(--muted)}
.match{display:grid;grid-template-columns:145px 1fr 90px 170px;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid #eef1f5}.match:last-child{border-bottom:0}.stage{font-size:12px;color:var(--muted);font-weight:700}.teams{display:flex;justify-content:flex-end;gap:10px;align-items:center;text-align:right}.vs{color:#9aa3b2;font-size:12px}.score{font-weight:900;font-size:20px;white-space:nowrap}.meta{font-size:12px;color:var(--muted)}.result{font-size:12px;font-weight:800;text-align:center;border-radius:999px;padding:6px 9px}.W{background:#dcfce7;color:var(--win)}.L{background:#fee2e2;color:var(--loss)}.D{background:#fef3c7;color:var(--draw)}
.empty{padding:30px 20px;color:var(--muted)}
.note{margin-top:26px;color:var(--muted);font-size:13px}
.hidden{display:none}
@media(max-width:800px){.controls{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.match{grid-template-columns:1fr 1fr auto}.stage{grid-column:1/-1}.meta{grid-column:1/-1}.teams{justify-content:flex-start;text-align:left}}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.comp-title{align-items:flex-start;flex-direction:column}.match{grid-template-columns:1fr auto}.teams{grid-column:1/-1;justify-content:space-between}.result{grid-column:2;grid-row:1}.score{grid-column:1;grid-row:2}.meta{grid-column:1/-1;grid-row:3}}
</style>
</head>
<body>

<div class="wrap">
<div class="eyebrow">Innebandy 2026</div>
<h1>Matchresultat</h1>
<p class="lead">Matcher, cuper och statistik – samlat på ett ställe.</p>
<div class="controls">
<input id="search" type="search" placeholder="Sök lag, t.ex. Örebro SK eller Nacka IBK…">
<select id="competition"><option value="all">Alla cuper</option></select>
</div>
</div>
</header>
<main class="wrap">
<div class="toolbar">
<span class="pill" id="matchCount"></span>
<span class="pill" id="teamCount"></span>
<span class="pill">V = vinst · O = oavgjort · F = förlust</span>
</div>

<section id="statsSection">
<div class="section-head"><div><div class="eyebrow">Valt lag</div><h2 id="selectedTeam">Örebro SK</h2></div></div>
<div class="stats" id="stats"></div>
</section>

<section>
<div class="section-head"><div><div class="eyebrow">Matcher</div><h2>Resultat per cup</h2></div></div>
<div id="competitions"></div>
</section>
<p class="note">Seriespel kan läggas till på samma sätt som cuperna. Datat i denna version bygger på matcherna i den bifogade bilden.</p>

const searchEl=document.getElementById('search');
const compEl=document.getElementById('competition');
const comps=[...new Set(matches.map(m=>m.competition))];
comps.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;compEl.appendChild(o)});

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function teams(){return [...new Set(matches.flatMap(m=>[m.home,m.away]))].sort((a,b)=>a.localeCompare(b,'sv'))}
function outcomeFor(team,m){
 const gf=m.home===team?m.homeGoals:m.awayGoals, ga=m.home===team?m.awayGoals:m.homeGoals;
 return gf>ga?'W':gf<ga?'L':'D';
}
function calc(team,arr){
 let w=0,d=0,l=0,gf=0,ga=0;
 arr.filter(m=>m.home===team||m.away===team).forEach(m=>{
  const home=m.home===team; const f=home?m.homeGoals:m.awayGoals, a=home?m.awayGoals:m.homeGoals;
  gf+=f;ga+=a;if(f>a)w++;else if(f<a)l++;else d++;
 });
 return {played:w+d+l,w,d,l,gf,ga};
}
function selectedTeam(){
 const q=searchEl.value.trim().toLowerCase();
 if(!q) return 'Örebro SK';
 return teams().find(t=>t.toLowerCase().includes(q)) || 'Örebro SK';
}
function renderStats(){
 const team=selectedTeam(), arr=matches.filter(m=>compEl.value==='all'||m.competition===compEl.value), s=calc(team,arr);
 document.getElementById('selectedTeam').textContent=team;
 document.getElementById('stats').innerHTML=[
  ['Matcher',s.played],['Vunna',s.w],['Oavgjorda',s.d],['Förlorade',s.l],['Gjorda mål',s.gf],['Insläppta',s.ga]
 ].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
 document.getElementById('matchCount').textContent=`${arr.length} matcher i urvalet`;
 document.getElementById('teamCount').textContent=`${teams().length} lag totalt`;
}
function formatDate(m){
 if(!m.date) return '';
 const d=new Date(m.date+'T12:00:00');
 return d.toLocaleDateString('sv-SE',{day:'numeric',month:'short'}).replace('.','')+(m.time?' · '+m.time:'');
}
function render(){
 const q=searchEl.value.trim().toLowerCase();
 const selectedComp=compEl.value;
 let arr=matches.filter(m=>{
  const text=(m.home+' '+m.away+' '+m.competition+' '+m.stage).toLowerCase();
  return (!q||text.includes(q))&&(selectedComp==='all'||m.competition===selectedComp);
 });
 const groups={}; arr.forEach(m=>(groups[m.competition]??=[]).push(m));
 const container=document.getElementById('competitions');
 container.innerHTML=Object.keys(groups).length?Object.entries(groups).map(([comp,ms])=>{
  return `<div class="competition"><div class="comp-title"><h3>${esc(comp)}</h3><small>${ms.length} matcher</small></div>${ms.map(m=>{
   const team=selectedTeam(), has=team===m.home||team===m.away, r=has?outcomeFor(team,m):'';
   return `<div class="match">
    <div class="stage">${esc(m.stage||'Match')}</div>
    <div class="teams"><span>${esc(m.home)}</span><span class="vs">–</span><span>${esc(m.away)}</span></div>
    <div class="score">${m.homeGoals} – ${m.awayGoals}</div>
    ${has?`<div class="result ${r}">${r==='W'?'VINST':r==='L'?'FÖRLUST':'OAVGJORT'}</div>`:'<div></div>'}
    <div class="meta">${esc(formatDate(m))}${m.venue?' · '+esc(m.venue):''}</div>
   </div>`
  }).join('')}</div>`;
 }).join(''):`<div class="competition"><div class="empty">Inga matcher hittades. Prova ett annat lag eller en annan cup.</div></div>`;
 renderStats();
}
searchEl.addEventListener('input',render); compEl.addEventListener('change',render);
